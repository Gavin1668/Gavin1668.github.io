{{ define "main" }}
<div class="dashboard-page">
  <style>
  .dashboard-page { padding: 20px 0; }
  .dash-clock { text-align: center; margin-bottom: 28px; }
  .dash-clock .time { font-size: 64px; font-weight: 200; letter-spacing: 3px; line-height: 1; }
  .dash-clock .date { font-size: 15px; opacity: 0.7; margin-top: 6px; }
  .dash-search { display: flex; gap: 8px; max-width: 600px; margin: 0 auto 28px; }
  .dash-search input {
    flex: 1; padding: 12px 20px; border: none; border-radius: 50px;
    background: var(--card-bg, rgba(255,255,255,0.9));
    color: inherit; font-size: 15px; outline: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .dash-search select {
    padding: 0 14px; border: none; border-radius: 50px;
    background: var(--card-bg, rgba(255,255,255,0.9));
    color: inherit; cursor: pointer; outline: none;
  }
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .dash-card {
    background: var(--card-bg, rgba(255,255,255,0.85));
    border-radius: 16px; padding: 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  .dash-card h3 {
    font-size: 13px; opacity: 0.6; margin-bottom: 12px;
    font-weight: 500; display: flex; justify-content: space-between;
  }
  .dash-card .close-btn {
    background: none; border: none; cursor: pointer; opacity: 0.4;
    font-size: 14px; line-height: 1;
  }
  .dash-card .close-btn:hover { opacity: 1; }

  /* Weather */
  .w-main { display: flex; align-items: center; gap: 14px; }
  .w-temp { font-size: 44px; font-weight: 300; }
  .w-icon { font-size: 36px; }
  .w-desc { font-size: 13px; opacity: 0.6; }
  .w-extra { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; opacity: 0.6; }
  .w-forecast {
    display: flex; justify-content: space-between; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid rgba(128,128,128,0.15);
  }
  .fc-day { text-align: center; font-size: 11px; }
  .fc-day .icon { font-size: 18px; margin: 3px 0; }

  /* Calendar */
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
  .cal-header button { background: none; border: none; color: inherit; cursor: pointer; font-size: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 12px; }
  .cal-grid .head { opacity: 0.5; padding: 3px 0; font-weight: 500; }
  .cal-grid .cell { padding: 5px 0; border-radius: 6px; }
  .cal-grid .cell.today { background: #667eea; color: #fff; font-weight: 600; }
  .cal-grid .cell .lunar { font-size: 9px; opacity: 0.7; display: block; }

  /* Bookmarks */
  .bm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }
  .bm-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; font-size: 10px; text-align: center; }
  .bm-item .favicon {
    width: 42px; height: 42px; border-radius: 10px;
    background: #667eea; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 3px;
  }
  .bm-add {
    width: 42px; height: 42px; border-radius: 10px;
    border: 2px dashed rgba(128,128,128,0.4); background: none;
    color: inherit; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Countdown */
  .cd-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(128,128,128,0.12); font-size: 13px; }
  .cd-item:last-child { border-bottom: none; }
  .cd-days { font-weight: 600; color: #667eea; }
  .cd-add { margin-top: 8px; padding: 5px 12px; background: #667eea; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; }

  /* Articles */
  .art-item { padding: 7px 0; border-bottom: 1px solid rgba(128,128,128,0.12); }
  .art-item:last-child { border-bottom: none; }
  .art-item a { color: inherit; text-decoration: none; font-size: 13px; }
  .art-item a:hover { color: #667eea; }
  .art-item .date { font-size: 11px; opacity: 0.5; }

  /* Modal */
  .dash-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: center; justify-content: center;
  }
  .dash-modal.show { display: flex; }
  .dash-modal-box {
    background: var(--card-bg, #fff); padding: 22px; border-radius: 16px;
    width: 90%; max-width: 380px;
  }
  .dash-modal-box h4 { margin-bottom: 14px; font-size: 15px; }
  .dash-modal-box input {
    width: 100%; padding: 10px; margin-bottom: 10px;
    border: 1px solid rgba(128,128,128,0.3); border-radius: 8px;
    background: transparent; color: inherit;
  }
  .dash-modal-box .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dash-modal-box button { padding: 7px 14px; border: none; border-radius: 8px; cursor: pointer; }
  .btn-primary { background: #667eea; color: #fff; }
  .btn-secondary { background: rgba(128,128,128,0.2); color: inherit; }

  @media (max-width: 768px) {
    .dash-clock .time { font-size: 44px; }
    .dash-grid { grid-template-columns: 1fr; }
  }
  </style>

  <div class="dash-clock">
    <div class="time" id="dashClock">00:00</div>
    <div class="date" id="dashDate">加载中...</div>
  </div>

  <div class="dash-search">
    <input type="text" id="dashSearch" placeholder="输入搜索内容..." onkeydown="if(event.key==='Enter')dashDoSearch()">
    <select id="dashEngine" onchange="dashSaveEngine()">
      <option value="https://www.baidu.com/s?wd=">百度</option>
      <option value="https://www.google.com/search?q=">谷歌</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
  </div>

  <div class="dash-grid" id="dashGrid">
    <div class="dash-card" data-id="weather">
      <h3>天气 <button class="close-btn" onclick="dashRemove(this)">×</button></h3>
      <div class="w-main">
        <div class="w-icon" id="wIcon">⛅</div>
        <div>
          <div class="w-temp" id="wTemp">--°</div>
          <div class="w-desc" id="wDesc">加载中...</div>
        </div>
      </div>
      <div class="w-extra" id="wExtra"></div>
      <div class="w-forecast" id="wForecast"></div>
    </div>

    <div class="dash-card" data-id="calendar">
      <h3>日历 <button class="close-btn" onclick="dashRemove(this)">×</button></h3>
      <div class="cal-header">
        <button onclick="dashChangeMonth(-1)">‹</button>
        <span id="calTitle">2024年1月</span>
        <button onclick="dashChangeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="dash-card" data-id="bookmarks">
      <h3>常用网站 <button class="close-btn" onclick="dashRemove(this)">×</button></h3>
      <div class="bm-grid" id="dashBmGrid"></div>
    </div>

    <div class="dash-card" data-id="countdown">
      <h3>倒计时 <button class="close-btn" onclick="dashRemove(this)">×</button></h3>
      <div id="dashCdList"></div>
    </div>

    <div class="dash-card" data-id="articles">
      <h3>最新文章 <button class="close-btn" onclick="dashRemove(this)">×</button></h3>
      <div id="dashArtList">
        {{ range first 5 (where .Site.RegularPages "Section" "in" (slice "post" "essay")) }}
        <div class="art-item">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <div class="date">{{ .Date.Format "2006-01-02" }}</div>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>

<div class="dash-modal" id="dashModal">
  <div class="dash-modal-box" id="dashModalBox"></div>
</div>

<script>
// Lunar calendar
const lunarInfo = [
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
];
function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+leapDays(y);}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function leapDays(y){if(leapMonth(y))return(lunarInfo[y-1900]&0x10000)?30:29;return 0;}
function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function solar2lunar(y,m,d){
  let offset=(Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000;
  let i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  const year=i;const leap=leapMonth(i);let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){--i;isLeap=true;temp=leapDays(year);}
    else{temp=monthDays(year,i);}
    if(isLeap&&i==(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset==0&&leap>0&&i==leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  const month=i,day=offset+1;
  const n=['日','一','二','三','四','五','六','七','八','九','十'];
  let ds;
  if(day==10)ds='初十';else if(day==20)ds='二十';else if(day==30)ds='三十';
  else{const sm=Math.floor((day-1)/10)+1;const dm=(day-1)%10;ds=n[dm]+['初','十','廿','卅'][sm-1];if(dm==0)ds=['初一','十一','廿一','卅一'][sm-1];}
  if(day==1){const ms=['正','二','三','四','五','六','七','八','九','十','冬','腊'];ds=(isLeap?'闰':'')+ms[month-1]+'月';}
  return ds;
}

// Clock
function dashUpdateClock(){
  const now=new Date();
  document.getElementById('dashClock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['日','一','二','三','四','五','六'];
  const lunar=solar2lunar(now.getFullYear(),now.getMonth()+1,now.getDate());
  document.getElementById('dashDate').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+days[now.getDay()]+' · '+lunar;
}
setInterval(dashUpdateClock,1000);dashUpdateClock();

// Search
function dashDoSearch(){const q=document.getElementById('dashSearch').value.trim();if(!q)return;const e=localStorage.getItem('dashSe')||'https://www.baidu.com/s?wd=';window.open(e+encodeURIComponent(q),'_blank');}
function dashSaveEngine(){localStorage.setItem('dashSe',document.getElementById('dashEngine').value);}
if(localStorage.getItem('dashSe'))document.getElementById('dashEngine').value=localStorage.getItem('dashSe');

// Weather
async function dashLoadWeather(){
  try{
    const lat=31.3,lon=120.6;
    const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Shanghai';
    const res=await fetch(url);const data=await res.json();
    const ic={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'⛈️',80:'🌦️',95:'⛈️'}[data.current.weather_code]||'⛅';
    document.getElementById('wIcon').textContent=ic;
    document.getElementById('wTemp').textContent=Math.round(data.current.temperature_2m)+'°';
    document.getElementById('wDesc').textContent='苏州 · '+data.current.relative_humidity_2m+'% 湿度';
    document.getElementById('wExtra').innerHTML='<span>💨 '+Math.round(data.current.wind_speed_10m)+' km/h</span><span>体感 '+Math.round(data.current.apparent_temperature)+'°</span>';
    const days=['日','一','二','三','四','五','六'];let fc='';
    for(let i=0;i<5;i++){
      const d=new Date(data.daily.time[i]);
      const fi={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',55:'🌧️',61:'🌧️',65:'⛈️',80:'🌦️',95:'⛈️'}[data.daily.weather_code[i]]||'⛅';
      fc+='<div class="fc-day"><div>'+(i===0?'今天':'周'+days[d.getDay()])+'</div><div class="icon">'+fi+'</div><div>'+Math.round(data.daily.temperature_2m_min[i])+'°~'+Math.round(data.daily.temperature_2m_max[i])+'°</div></div>';
    }
    document.getElementById('wForecast').innerHTML=fc;
  }catch(e){document.getElementById('wDesc').textContent='天气加载失败';}
}
dashLoadWeather();

// Calendar
let calYear,calMonth;
(function(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();dashRenderCal();})();
function dashChangeMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}dashRenderCal();}
function dashRenderCal(){
  document.getElementById('calTitle').textContent=calYear+'年'+(calMonth+1)+'月';
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  let html=['日','一','二','三','四','五','六'].map(d=>'<div class="head">'+d+'</div>').join('');
  for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const isToday=(d===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear());
    const lunar=solar2lunar(calYear,calMonth+1,d);
    html+='<div class="cell '+(isToday?'today':'')+'">'+d+'<span class="lunar">'+lunar+'</span></div>';
  }
  document.getElementById('calGrid').innerHTML=html;
}

// Bookmarks
const dashDefaultBms=[
  {name:'GitHub',url:'https://github.com',icon:'🐙'},
  {name:'掘金',url:'https://juejin.cn',icon:'💎'},
  {name:'少数派',url:'https://sspai.com',icon:'📰'},
  {name:'MDN',url:'https://developer.mozilla.org',icon:'📘'},
];
function dashGetBms(){return JSON.parse(localStorage.getItem('dashBms')||JSON.stringify(dashDefaultBms));}
function dashRenderBms(){
  document.getElementById('dashBmGrid').innerHTML=dashGetBms().map(b=>
    '<a class="bm-item" href="'+b.url+'" target="_blank" title="'+b.name+'"><div class="favicon">'+(b.icon||'🔗')+'</div>'+b.name+'</a>'
  ).join('')+'<button class="bm-add" onclick="dashAddBm()">+</button>';
}
function dashAddBm(){
  dashShowModal('<h4>添加书签</h4><input id="bmN" placeholder="名称"><input id="bmU" placeholder="网址"><input id="bmI" placeholder="图标 emoji"><div class="actions"><button class="btn-secondary" onclick="dashCloseModal()">取消</button><button class="btn-primary" onclick="dashSaveBm()">保存</button></div>');
}
function dashSaveBm(){
  const n=document.getElementById('bmN').value.trim();const u=document.getElementById('bmU').value.trim();const i=document.getElementById('bmI').value.trim()||'🔗';
  if(!n||!u)return;const bms=dashGetBms();bms.push({name:n,url:u.startsWith('http')?u:'https://'+u,icon:i});
  localStorage.setItem('dashBms',JSON.stringify(bms));dashRenderBms();dashCloseModal();
}
dashRenderBms();

// Countdown
function dashGetCds(){return JSON.parse(localStorage.getItem('dashCds')||JSON.stringify([{name:'新年',date:new Date(new Date().getFullYear()+1,0,1).toISOString().slice(0,10)}]));}
function dashRenderCds(){
  const items=dashGetCds();const now=new Date();
  document.getElementById('dashCdList').innerHTML=items.map(it=>{
    const days=Math.ceil((new Date(it.date)-now)/86400000);
    return '<div class="cd-item"><span>'+it.name+'</span><span class="cd-days">'+(days>0?days+'天':'今天')+'</span></div>';
  }).join('')+'<button class="cd-add" onclick="dashAddCd()">+ 添加倒计时</button>';
}
function dashAddCd(){
  dashShowModal('<h4>添加倒计时</h4><input id="cdN" placeholder="名称"><input id="cdD" type="date"><div class="actions"><button class="btn-secondary" onclick="dashCloseModal()">取消</button><button class="btn-primary" onclick="dashSaveCd()">保存</button></div>');
}
function dashSaveCd(){
  const n=document.getElementById('cdN').value.trim();const d=document.getElementById('cdD').value;
  if(!n||!d)return;const items=dashGetCds();items.push({name:n,date:d});
  localStorage.setItem('dashCds',JSON.stringify(items));dashRenderCds();dashCloseModal();
}
dashRenderCds();

// Modal
function dashShowModal(h){document.getElementById('dashModalBox').innerHTML=h;document.getElementById('dashModal').classList.add('show');}
function dashCloseModal(){document.getElementById('dashModal').classList.remove('show');}
document.getElementById('dashModal').addEventListener('click',e=>{if(e.target===e.currentTarget)dashCloseModal();});

// Card close
function dashRemove(btn){btn.closest('.dash-card').style.display='none';}
</script>
{{ end }}
