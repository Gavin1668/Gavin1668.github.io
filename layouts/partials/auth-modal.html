{{/* 登录/注册弹窗 */}}
<div class="auth-modal" id="authModal" style="display:none;">
    <div class="auth-modal-mask" onclick="closeAuthModal()"></div>
    <div class="auth-modal-box">
        <button class="auth-close" onclick="closeAuthModal()">×</button>
        
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">登录</button>
            <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">注册</button>
        </div>

        <div class="auth-form" id="loginForm">
            <h3 class="auth-title">欢迎回来</h3>
            <div class="auth-field">
                <label>邮箱</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="auth-error" id="loginError" style="display:none;"></div>
            <button class="auth-submit" onclick="handleLogin()">登录</button>
            <div class="auth-footer" style="display:flex;justify-content:space-between;align-items:center;">
                <a href="javascript:;" onclick="switchAuthTab('register')">还没有账号？立即注册</a>
                <a href="javascript:;" onclick="handleForgotPassword()" style="font-size:12px;color:#999;">忘记密码？</a>
            </div>
        </div>

        <div class="auth-form" id="registerForm" style="display:none;">
            <h3 class="auth-title">创建账号</h3>
            <div class="auth-field">
                <label>邮箱</label>
                <input type="email" id="registerEmail" placeholder="your@email.com（支持网易、QQ、163等）">
            </div>
            <div class="auth-field">
                <label>验证码</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="registerCode" placeholder="6位验证码" maxlength="6" style="flex:1;">
                    <button type="button" id="sendCodeBtn" onclick="sendVerificationCode()" style="white-space:nowrap;font-size:12px;padding:10px 14px;border:1px solid #E8500E;border-radius:10px;background:#fff;color:#E8500E;cursor:pointer;transition:all .2s;">发送验证码</button>
                </div>
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" id="registerPassword" placeholder="至少6位密码" oninput="checkPasswordStrength()">
                <div class="pw-strength">
                    <div class="pw-bar">
                        <span class="pw-bar-item" id="pwBar1"></span>
                        <span class="pw-bar-item" id="pwBar2"></span>
                        <span class="pw-bar-item" id="pwBar3"></span>
                    </div>
                    <span class="pw-text" id="pwText">密码强度：弱</span>
                </div>
            </div>
            <div class="auth-field">
                <label>确认密码</label>
                <input type="password" id="registerPassword2" placeholder="再次输入密码">
            </div>
            {{/* 蜜罐字段：机器人会填，人看不到 */}}
            <div style="position:absolute;left:-9999px;top:-9999px;opacity:0;" aria-hidden="true">
                <label>请不要填写此字段</label>
                <input type="text" id="registerHoneypot" tabindex="-1" autocomplete="off">
            </div>
            <div class="auth-error" id="registerError" style="display:none;"></div>
            <button class="auth-submit" onclick="handleRegister()">注册</button>
            <div class="auth-footer">
                <a href="javascript:;" onclick="switchAuthTab('login')">已有账号？去登录</a>
            </div>
        </div>

        <div class="auth-agreement">
            注册即表示同意《用户协议》和《隐私政策》
        </div>
    </div>
</div>

{{/* 个人资料设置弹窗 */}}
<div class="auth-modal" id="profileModal" style="display:none;">
    <div class="auth-modal-mask" onclick="closeProfileModal()"></div>
    <div class="auth-modal-box">
        <button class="auth-close" onclick="closeProfileModal()">×</button>
        <h3 class="auth-title">个人资料设置</h3>
        
        <div class="auth-field">
            <label>当前头像</label>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                <span class="user-avatar" id="profileAvatarPreview" style="width:48px;height:48px;border-radius:50%;background:#E8500E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;">U</span>
                <div style="flex:1;">
                    <input type="text" id="profileAvatarUrl" placeholder="头像图片 URL（可选）" style="font-size:13px;">
                </div>
            </div>
        </div>
        
        <div class="auth-field">
            <label>昵称</label>
            <input type="text" id="profileNickname" placeholder="输入你的昵称">
        </div>
        
        <div class="auth-field">
            <label>邮箱</label>
            <input type="email" id="profileEmail" disabled style="background:#f5f5f5;color:#999;">
        </div>
        
        <div class="auth-field">
            <label>注册时间</label>
            <input type="text" id="profileCreatedAt" disabled style="background:#f5f5f5;color:#999;">
        </div>
        
        <hr style="border:none;border-top:1px solid #eee;margin:20px 0;">
        
        <div class="auth-field">
            <label>修改密码（留空则不修改）</label>
            <input type="password" id="profileNewPassword" placeholder="新密码（至少6位）">
        </div>
        
        <div class="auth-error" id="profileError" style="display:none;"></div>
        <button class="auth-submit" onclick="saveProfile()">保存修改</button>
    </div>
</div>

<style>
.auth-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;}
.auth-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);}
.auth-modal-box{
    position:relative;width:400px;max-width:90vw;
    background:#fff;border-radius:20px;padding:32px;
    box-shadow:0 24px 64px rgba(0,0,0,.2);
    animation:authSlideUp .3s ease;
}
@keyframes authSlideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.auth-close{
    position:absolute;top:16px;right:16px;
    width:28px;height:28px;border:none;border-radius:50%;
    background:#f0f0f0;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#666;transition:all .2s;
}
.auth-close:hover{background:#e0e0e0;}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid #eee;}
.auth-tab{
    flex:1;padding:10px;border:none;background:transparent;
    font-size:15px;color:#999;cursor:pointer;
    border-bottom:2px solid transparent;
    transition:all .2s;
}
.auth-tab.active{color:#E8500E;border-bottom-color:#E8500E;font-weight:600;}
.auth-title{font-size:20px;font-weight:700;margin-bottom:20px;color:#1A1A1A;}
.auth-field{margin-bottom:16px;}
.auth-field label{display:block;font-size:13px;color:#666;margin-bottom:6px;}
.auth-field input{
    width:100%;padding:10px 14px;border:1px solid #e0e0e0;
    border-radius:10px;font-size:14px;outline:none;
    transition:border-color .2s;
    box-sizing:border-box;
}
.auth-field input:focus{border-color:#E8500E;}
.auth-error{
    padding:10px 14px;background:#fff2f0;border:1px solid #ffccc7;
    border-radius:8px;color:#cf1322;font-size:13px;margin-bottom:16px;
}
.auth-submit{
    width:100%;padding:12px;border:none;border-radius:12px;
    background:#E8500E;color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;transition:background .2s;
}
.auth-submit:hover{background:#d1460c;}
.auth-footer{text-align:center;margin-top:16px;font-size:13px;}
.auth-footer a{color:#E8500E;text-decoration:none;}
.auth-agreement{
    margin-top:20px;text-align:center;
    font-size:11px;color:#999;
}
.pw-strength{
    margin-top:8px;
    display:flex;align-items:center;gap:10px;
}
.pw-bar{
    display:flex;gap:4px;
    flex:1;
}
.pw-bar-item{
    flex:1;height:4px;border-radius:2px;
    background:#e0e0e0;
    transition:background .2s;
}
.pw-bar-item.weak{background:#cf1322;}
.pw-bar-item.medium{background:#faad14;}
.pw-bar-item.strong{background:#52c41a;}
.pw-text{
    font-size:11px;color:#999;
    white-space:nowrap;
}
@media (max-width:640px){
    .auth-modal-box{padding:24px 20px;}
}
</style>

<script>
// Supabase 登录系统
let currentUser = null;

function getCurrentUser() {
    return currentUser;
}

// 检查邮箱是否已验证
function isEmailVerified() {
    if (!currentUser) return false;
    return !!currentUser.email_confirmed_at;
}

// 把 Supabase 英文错误翻译成中文
function translateError(errMsg) {
    if (!errMsg) return '操作失败，请稍后再试';
    const msg = errMsg.toLowerCase();
    if (msg.includes('invalid login credentials')) return '邮箱或密码错误';
    if (msg.includes('user already registered')) return '该邮箱已注册，请直接登录';
    if (msg.includes('email not confirmed')) return '邮箱尚未验证，请先查收邮件并完成验证';
    if (msg.includes('password should be at least')) return '密码至少需要 6 位字符';
    if (msg.includes('invalid email')) return '邮箱格式不正确，请检查后重试';
    if (msg.includes('supabaseclient is not defined')) return '系统初始化中，请刷新页面重试';
    if (msg.includes('fetch failed')) return '网络连接失败，请检查网络后重试';
    if (msg.includes('email rate limit exceeded')) return '操作过于频繁，请稍后再试';
    if (msg.includes('signup disabled')) return '注册功能暂未开启，请联系站长';
    return errMsg;
}

// 密码强度检测
function checkPasswordStrength() {
    var pw = document.getElementById('registerPassword').value;
    var bar1 = document.getElementById('pwBar1');
    var bar2 = document.getElementById('pwBar2');
    var bar3 = document.getElementById('pwBar3');
    var text = document.getElementById('pwText');
    
    // 重置
    bar1.className = 'pw-bar-item';
    bar2.className = 'pw-bar-item';
    bar3.className = 'pw-bar-item';
    
    if (!pw) {
        text.textContent = '密码强度：';
        return;
    }
    
    var score = 0;
    // 长度 >= 6 得 1 分
    if (pw.length >= 6) score++;
    // 包含数字和字母 得 1 分
    if (/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    // 包含特殊字符或长度 >= 10 得 1 分
    if (/[^a-zA-Z0-9]/.test(pw) || pw.length >= 10) score++;
    
    if (score <= 1) {
        bar1.classList.add('weak');
        text.textContent = '密码强度：弱';
    } else if (score === 2) {
        bar1.classList.add('medium');
        bar2.classList.add('medium');
        text.textContent = '密码强度：中';
    } else {
        bar1.classList.add('strong');
        bar2.classList.add('strong');
        bar3.classList.add('strong');
        text.textContent = '密码强度：强';
    }
}

function updateNavUser() {
    var loginBtn = document.getElementById('navLoginBtn');
    var navUser = document.getElementById('navUser');
    if (!loginBtn || !navUser) return;
    
    if (currentUser) {
        loginBtn.style.display = 'none';
        navUser.style.display = 'flex';
        var name = currentUser.user_metadata?.name || '用户' + (currentUser.id || '').slice(0, 5);
        document.getElementById('navUserName').textContent = name;
        document.getElementById('navUserAvatar').textContent = name.charAt(0);
    } else {
        loginBtn.style.display = 'block';
        navUser.style.display = 'none';
    }
}

function openAuthModal(tab) {
    document.getElementById('authModal').style.display = 'flex';
    switchAuthTab(tab || 'login');
}

function closeAuthModal() {
    document.getElementById('authModal').style.display = 'none';
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('registerError').style.display = 'none';
}

function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(function(el) {
        el.classList.toggle('active', el.dataset.tab === tab);
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function showError(id, msg) {
    var el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
}

// 生成随机用户名（纯数字）
function generateRandomName() {
    return '用户' + Math.floor(10000 + Math.random() * 90000);
}

// 页面打开时间（反机器人用）
var pageLoadTime = Date.now();

// 允许的邮箱域名白名单
var allowedEmailDomains = [
    'qq.com', '163.com', '126.com', 'sina.com', 'sina.cn',
    'gmail.com', 'outlook.com', 'hotmail.com', 'foxmail.com',
    'yeah.net', 'aliyun.com', '139.com'
];

// 检查邮箱域名是否在白名单
function checkEmailDomain(email) {
    var domain = email.split('@')[1]?.toLowerCase();
    if (!domain) return false;
    return allowedEmailDomains.includes(domain);
}

// 反机器人检查
function antiBotCheck() {
    // 1. 蜜罐字段检查：如果填了，判定为机器人
    var honeypot = document.getElementById('registerHoneypot').value;
    if (honeypot && honeypot.trim() !== '') {
        return '检测到异常操作，请刷新页面后重试';
    }
    
    // 2. 时间差检查：页面打开不到 2 秒就提交，判定为机器人
    var elapsed = Date.now() - pageLoadTime;
    if (elapsed < 2000) {
        return '注册操作过快，请稍后再试';
    }
    
    return null; // 通过
}

// 登录
async function handleLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    
    if (!email) { showError('loginError', '请输入邮箱'); return; }
    if (!password) { showError('loginError', '请输入密码'); return; }
    
    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        if (error) throw error;
        
        // 检查邮箱是否已验证
        if (data.user && !data.user.email_confirmed_at) {
            closeAuthModal();
            alert('您的邮箱还未验证！\n\n我们已向您的邮箱发送了验证链接，请点击邮件中的链接完成验证后，再使用完整功能。\n\n（如果没收到邮件，请检查垃圾邮件文件夹）');
            return;
        }
        
        closeAuthModal();
        alert('登录成功！');
    } catch (err) {
        showError('loginError', translateError(err.message));
    }
}

// 忘记密码
async function handleForgotPassword() {
    var email = document.getElementById('loginEmail').value.trim();
    if (!email) {
        showError('loginError', '请先输入你的邮箱地址');
        return;
    }
    
    try {
        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
        });
        if (error) throw error;
        alert('重置密码邮件已发送！\n\n请查收邮箱，点击邮件里的链接重置密码。');
    } catch (err) {
        showError('loginError', translateError(err.message));
    }
}

// 发送验证码倒计时
var countdownTimer = null;
function startCountdown(seconds) {
    var btn = document.getElementById('sendCodeBtn');
    var remaining = seconds;
    btn.disabled = true;
    btn.textContent = remaining + '秒后重发';
    btn.style.opacity = '0.6';
    
    countdownTimer = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
            clearInterval(countdownTimer);
            btn.disabled = false;
            btn.textContent = '发送验证码';
            btn.style.opacity = '1';
        } else {
            btn.textContent = remaining + '秒后重发';
        }
    }, 1000);
}

// 发送验证码
async function sendVerificationCode() {
    var email = document.getElementById('registerEmail').value.trim();
    
    if (!email) { showError('registerError', '请先输入邮箱'); return; }
    if (!email.includes('@')) { showError('registerError', '邮箱格式不正确'); return; }
    
    // 邮箱域名白名单检查
    if (!checkEmailDomain(email)) {
        showError('registerError', '暂不支持该邮箱后缀，请使用 QQ、163、126、Gmail 等常用邮箱注册');
        return;
    }
    
    // 反机器人检查
    var botError = antiBotCheck();
    if (botError) {
        showError('registerError', botError);
        return;
    }
    
    var btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';
    
    try {
        // 调用 Edge Function 发送验证码
        const { data, error } = await supabaseClient.functions.invoke('email-verification', {
            body: { action: 'send', email: email }
        });
        
        if (error) throw error;
        
        if (data && data.success) {
            showError('registerError', '验证码已发送，请查收邮箱（5分钟内有效）');
            document.getElementById('registerError').style.background = '#f6ffed';
            document.getElementById('registerError').style.borderColor = '#b7eb8f';
            document.getElementById('registerError').style.color = '#52c41a';
            startCountdown(60);
        } else {
            throw new Error(data?.error || '发送失败');
        }
    } catch (err) {
        showError('registerError', err.message || '发送失败，请稍后再试');
        btn.disabled = false;
        btn.textContent = '发送验证码';
    }
}

// 验证验证码
async function verifyCode(email, code) {
    try {
        const { data, error } = await supabaseClient.functions.invoke('email-verification', {
            body: { action: 'verify', email: email, code: code }
        });
        
        if (error) throw error;
        
        return data && data.success;
    } catch (err) {
        console.error('验证验证码失败:', err);
        return false;
    }
}

// 注册
async function handleRegister() {
    var email = document.getElementById('registerEmail').value.trim();
    var code = document.getElementById('registerCode').value.trim();
    var password = document.getElementById('registerPassword').value;
    var password2 = document.getElementById('registerPassword2').value;
    
    if (!email) { showError('registerError', '请输入邮箱'); return; }
    if (!email.includes('@')) { showError('registerError', '邮箱格式不正确'); return; }
    
    // 邮箱域名白名单检查
    if (!checkEmailDomain(email)) {
        showError('registerError', '暂不支持该邮箱后缀，请使用 QQ、163、126、Gmail 等常用邮箱注册');
        return;
    }
    
    if (!code) { showError('registerError', '请输入验证码'); return; }
    if (code.length !== 6) { showError('registerError', '验证码为6位数字'); return; }
    
    if (password.length < 6) { showError('registerError', '密码至少6位'); return; }
    if (password !== password2) { showError('registerError', '两次输入的密码不一致'); return; }
    
    // 反机器人检查
    var botError = antiBotCheck();
    if (botError) {
        showError('registerError', botError);
        return;
    }
    
    // 先验证验证码
    showError('registerError', '正在验证验证码...');
    document.getElementById('registerError').style.background = '#e6f7ff';
    document.getElementById('registerError').style.borderColor = '#91d5ff';
    document.getElementById('registerError').style.color = '#1890ff';
    
    var verified = await verifyCode(email, code);
    if (!verified) {
        showError('registerError', '验证码错误或已过期，请重新获取');
        return;
    }
    
    var name = generateRandomName();
    
    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { name: name },
                emailRedirectTo: window.location.origin
            }
        });
        if (error) throw error;
        closeAuthModal();
        alert('注册成功！欢迎 ' + name + '\n\n您的账号已创建，可以直接登录使用了。');
    } catch (err) {
        showError('registerError', translateError(err.message));
    }
}

// 退出
async function logout() {
    try {
        await supabaseClient.auth.signOut();
        alert('已退出登录');
        location.reload();
    } catch (err) {
        alert('退出失败，请稍后再试');
    }
}

// ===== 个人资料设置 =====
function openProfileModal() {
    if (!currentUser) return;
    
    var user = currentUser;
    var name = user.user_metadata?.name || '用户' + (user.id || '').slice(0, 5);
    var avatarUrl = user.user_metadata?.avatar_url || '';
    var email = user.email || '';
    var createdAt = user.created_at ? new Date(user.created_at).toLocaleString('zh-CN') : '';
    
    document.getElementById('profileNickname').value = name;
    document.getElementById('profileAvatarUrl').value = avatarUrl;
    document.getElementById('profileEmail').value = email;
    document.getElementById('profileCreatedAt').value = createdAt;
    
    // 更新头像预览
    var avatarPreview = document.getElementById('profileAvatarPreview');
    if (avatarUrl) {
        avatarPreview.innerHTML = '<img src="' + avatarUrl + '" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">';
    } else {
        avatarPreview.textContent = name.charAt(0).toUpperCase();
    }
    
    document.getElementById('profileError').style.display = 'none';
    document.getElementById('profileModal').style.display = 'flex';
}

function closeProfileModal() {
    document.getElementById('profileModal').style.display = 'none';
    document.getElementById('profileError').style.display = 'none';
}

async function saveProfile() {
    if (!currentUser) return;
    
    var nickname = document.getElementById('profileNickname').value.trim();
    var avatarUrl = document.getElementById('profileAvatarUrl').value.trim();
    var newPassword = document.getElementById('profileNewPassword').value;
    
    if (!nickname) {
        document.getElementById('profileError').textContent = '昵称不能为空';
        document.getElementById('profileError').style.display = 'block';
        return;
    }
    
    try {
        var updateData = {
            data: {
                name: nickname,
                avatar_url: avatarUrl
            }
        };
        
        // 如果要修改密码
        if (newPassword) {
            if (newPassword.length < 6) {
                document.getElementById('profileError').textContent = '新密码至少6位';
                document.getElementById('profileError').style.display = 'block';
                return;
            }
            updateData.password = newPassword;
        }
        
        const { data, error } = await supabaseClient.auth.updateUser(updateData);
        
        if (error) throw error;
        
        // 更新本地 currentUser
        currentUser = data.user;
        
        alert('保存成功！');
        closeProfileModal();
        
        // 更新界面显示
        updateNavUser();
        if (window.updateUserPanel) updateUserPanel();
    } catch (err) {
        document.getElementById('profileError').textContent = translateError(err.message);
        document.getElementById('profileError').style.display = 'block';
    }
}

// 初始化（等 supabaseClient 加载完再监听）
document.addEventListener('DOMContentLoaded', async function() {
    // 等待 supabaseClient 就绪
    if (typeof supabaseClient === 'undefined') {
        console.warn('supabaseClient 未定义，等待加载...');
        return;
    }
    
    // 监听登录状态变化
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session?.user) {
            currentUser = session.user;
        } else {
            currentUser = null;
        }
        updateNavUser();
        if (window.updateMsgInputArea) updateMsgInputArea();
        if (window.updateUserPanel) updateUserPanel();
    });
    
    // 获取当前 session
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) {
        currentUser = session.user;
    }
    updateNavUser();
});
</script>
