name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'        # 北京时间每日 08:00：拉取每日信息源后重新构建部署
  workflow_dispatch:

permissions:
  contents: write              # 允许信息源脚本 commit data/*.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch daily sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/fetch_sources.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Clone theme (shallow)
        run: git clone --depth 1 https://github.com/Gavin1668/hugo-theme-stack.git themes/hugo-theme-stack

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.145.0
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources
            ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('hugo.yaml', 'assets/**', 'layouts/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
