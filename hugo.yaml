baseurl: "https://gavin1668.github.io/"
canonifyURLs: false
languageCode: zh-cn
theme: hugo-theme-stack
pagination:
  pagerSize: 5
title: Gavin's Blog

languages:
  zh-cn:
    languageName: 中文
    title: Gavin's Blog
    description: Gavin 的技术博客：分享 Hugo / GitHub Pages 搭建折腾、编程实践与读书笔记。
    weight: 1

DefaultContentLanguage: zh-cn
hasCJKLanguage: true

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  favicon:

  footer:
    since: 2022
    customText:

  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02 15:04

  sidebar:
    emoji: 💻
    subtitle: 代码、思考与生活。
    avatar:
      enabled: true
      local: true
      src: img/avatar.png

  article:
    math: false
    toc: true
    readingTime: true
    license:
      enabled: true
      default: CC BY-NC-SA 4.0

  comments:
    enabled: false

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  opengraph:
    twitter:
      site: "@Gavin1668"
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true
  seo:
    description: "Gavin 的技术博客：分享 Hugo / GitHub Pages 搭建折腾、编程实践与读书笔记。"
    keywords:
      - Hugo
      - GitHub Pages
      - 技术博客
      - 编程
      - 电机工程
      - BLDC
      - 步进电机

menu:
  main:
    # 关于(about) 由 content/page/about 的 front matter 管理，已带 icon: user，此处不重复定义
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 2
      params:
        icon: archives
    - identifier: search
      name: 搜索
      url: /search/
      weight: 3
      params:
        icon: search
    - identifier: recommended
      name: 推荐
      url: /recommended/
      weight: 4
      params:
        icon: messages
    - identifier: dimensional-chain
      name: 尺寸链计算
      url: /tools/dimensional-chain-calculator.html
      weight: 5
      params:
        icon: link

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/Gavin1668
      params:
        icon: brand-github
    - identifier: rss
      name: RSS
      url: /index.xml
      params:
        icon: rss

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    renderer:
      unsafe: false
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
